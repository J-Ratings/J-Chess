<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>J-Chess + Stockfish</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="chessboardjs-1.0.0/css/chessboard-1.0.0.min.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }
    #controls {
      margin: 15px 0;
    }
    #controls > * {
      margin: 0 8px;
      padding: 8px 16px;
      font-size: 1em;
      cursor: pointer;
    }

    /* Board container & spinner overlay */
    #board-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      aspect-ratio: 1;
    }
    #board {
      width: 100%;
      height: 100%;
    }
    #loadingSpinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      border: 6px solid #eee;
      border-top: 6px solid #0077cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
      pointer-events: none;
    }
    @keyframes spin {
      0%   { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* FEN output */
    #fenContainer {
      margin: 12px auto;
      max-width: 400px;
      display: none;
    }
    #fenOutput {
      width: 100%;
      padding: 8px;
      font-family: monospace;
      rows: 2;
    }

    /* Status text */
    #fairStatus {
      margin: 12px auto;
      max-width: 400px;
      text-align: left;
      font-family: monospace;
      white-space: pre-wrap;
    }

    /* Stats below board */
    #stats {
      margin-top: 12px;
      text-align: center;
    }
    #stats h2 {
      margin: 6px 0;
      font-size: 1.2em;
      font-weight: 600;
    }

    /* Highlight styles */
    .highlight-white {
      box-shadow: inset 0 0 3px 3px yellow !important;
    }
    .highlight-black {
      box-shadow: inset 0 0 3px 3px blue !important;
    }
  </style>
</head>
<body>
  <h1>J-Chess</h1>

  <div id="controls">
    <button id="randomiseBtn">Generate Position</button>
    <button id="fairBtn">Generate Fair Position</button>
    <label for="timeSelect">Analysis Time:</label>
    <select id="timeSelect">
      <option value="250">0.25 s</option>
      <option value="500">0.5 s</option>
      <option value="1000" selected>1 s</option>
      <option value="2000">2 s</option>
      <option value="5000">5 s</option>
    </select>
    <label for="levelSelect">Level:</label>
    <select id="levelSelect">
      <option value="1">Lv. 1</option>
      <option value="2">Lv. 2</option>
      <option value="3">Lv. 3</option>
      <option value="4">Lv. 4</option>
      <option value="5" selected>Lv. 5</option>
      <option value="6">Lv. 6</option>
      <option value="7">Lv. 7</option>
      <option value="8">Lv. 8</option>
      <option value="9">Lv. 9</option>
      <option value="10">Lv. 10</option>
    </select>
    <button id="getFenBtn">Get FEN</button>
  </div>

  <div id="board-container">
    <div id="board"></div>
    <div id="loadingSpinner"></div>
  </div>

  <div id="fenContainer">
    <textarea id="fenOutput" readonly rows="2"></textarea>
  </div>

  <div id="fairStatus"></div>

  <div id="stats">
    <h2>8.3 million starting positions</h2>
    <h2>2.5 million fair starting positions</h2>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nodesByLevel = {
        1:1,2:10,3:1000,4:10000,5:25000,
        6:50000,7:100000,8:250000,9:250000,10:500000
      };
      const levelToSkill = {1:1,2:3,3:5,4:8,5:10,6:12,7:14,8:16,9:18,10:20};
      let currentLevel  = 5;
      let searchingFair = false;
      let engine, evalEngine;

      try {
        engine     = new Worker('engine/stockfish-17-lite-single.js');
        evalEngine = new Worker('engine/stockfish-17-lite-single.js');
      } catch (e) {
        console.warn('⚠️ Stockfish failed to load', e);
        return;
      }

      function eloForLevel(lv) {
        const min=1350, max9=2999;
        return lv<10
          ? Math.round(min + ((lv-1)/8)*(max9-min))
          : null;
      }

      const $board = $('#board');
      function clearHighlights(){
        $board.find('.square-55d63')
              .removeClass('highlight-white highlight-black');
      }
      function highlightMove(f,t,col){
        clearHighlights();
        $board.find(`.square-${f}`)
              .addClass(`highlight-${col}`);
        $board.find(`.square-${t}`)
              .addClass(`highlight-${col}`);
      }

      function createEngine(w,name){
        w.postMessage('uci');
        w.addEventListener('message', ({data})=>{
          const line = data.trim();
          if(line==='uciok'){
            w.postMessage('ucinewgame');
            if(currentLevel<10){
              w.postMessage('setoption name UCI_LimitStrength value true');
              w.postMessage('setoption name UCI_Elo value '+ eloForLevel(currentLevel));
              w.postMessage('setoption name Skill Level value '+ levelToSkill[currentLevel]);
            } else {
              w.postMessage('setoption name UCI_LimitStrength value false');
            }
            w.postMessage('isready');
          }
          if(line==='readyok'){
            console.log(`✅ ${name} ready`);
          }
        });
      }
      createEngine(engine, 'Play-engine');
      createEngine(evalEngine, 'Eval-engine');

      $('#levelSelect').on('change', function(){
        currentLevel = +this.value;
        const elo = eloForLevel(currentLevel);
        const skill = levelToSkill[currentLevel];
        [engine, evalEngine].forEach(w=>{
          if(currentLevel<10){
            w.postMessage('setoption name UCI_LimitStrength value true');
            w.postMessage('setoption name UCI_Elo value '+ elo);
            w.postMessage('setoption name Skill Level value '+ skill);
          } else {
            w.postMessage('setoption name UCI_LimitStrength value false');
          }
        });
      });

      const game = new Chess();
      const board = Chessboard('board',{
        draggable: true,
        position: 'start',
        pieceTheme: 'chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png',
        onDragStart, onDrop, onSnapEnd
      });
      $(window).resize(board.resize);

      function onDragStart(src,piece){
        return !(game.game_over()||piece[0]!=='w');
      }
      function onSnapEnd(){
        board.position(game.fen(), false);
      }
      function onDrop(src,tgt){
        const mv = game.move({from:src,to:tgt,promotion:'q'});
        if(!mv) return 'snapback';
        highlightMove(src,tgt,'white');
        setTimeout(()=>{
          engine.postMessage('position fen '+game.fen());
          engine.postMessage('go nodes '+ (nodesByLevel[currentLevel]||10000));
        },250);
      }

      engine.addEventListener('message', ({data})=>{
        const line = data.trim();
        if(line.startsWith('bestmove') && !searchingFair){
          const uci = line.split(' ')[1],
                f = uci.slice(0,2),
                t = uci.slice(2,4);
          highlightMove(f,t,'black');
          const r = game.move({from:f,to:t,promotion:'q'});
          if(r) board.position(game.fen(), false);
        }
      });

      const statusDiv = document.getElementById('fairStatus');
      const fenDiv    = document.getElementById('fenContainer');

      $('#randomiseBtn').click(()=>{
        fenDiv.style.display = 'none';
        statusDiv.textContent = '';
        const fen = generateJChessFEN();
        game.load(fen);
        board.position(fen,false);
      });

      $('#fairBtn').click(() => {
        if(searchingFair) return;
        fenDiv.style.display = 'none';
        statusDiv.textContent = '';
        searchingFair = true;
        document.getElementById('loadingSpinner').style.display = 'block';
        tryNextFair();
      });

      function tryNextFair(){
        const fen = generateJChessFEN();
        statusDiv.textContent += fen + '\n';
        let lastCp = null;
        const ms = +document.getElementById('timeSelect').value;

        evalEngine.postMessage('position fen ' + fen);
        evalEngine.postMessage('go movetime ' + ms);

        function onEval({data}){
          const line = data.trim();
          if(line.startsWith('info') && line.includes('score cp')){
            const m = line.match(/score cp (-?\d+)/);
            if(m) lastCp = +m[1];
          }
          if(line.startsWith('bestmove')){
            evalEngine.removeEventListener('message', onEval);
            const score = ((lastCp||0)/100).toFixed(2);
            const isFair = Math.abs(lastCp/100) <= 0.4;
            statusDiv.textContent += `${score} => ${isFair ? 'Fair' : 'Unfair'}\n\n`;
            if(isFair){
              game.load(fen);
              board.position(game.fen(),false);
              searchingFair = false;
              document.getElementById('loadingSpinner').style.display = 'none';
            } else {
              setTimeout(tryNextFair,30);
            }
          }
        }
        evalEngine.addEventListener('message', onEval);
      }

      function shuffle(arr){
        const a = arr.slice();
        for(let i=a.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [a[i],a[j]] = [a[j],a[i]];
        }
        return a;
      }
      function generateBackRank(){
        const P = ['r','n','b','q','k','b','n','r'];
        let R,b;
        do{
          R = shuffle(P);
          b = [R.indexOf('b'), R.lastIndexOf('b')];
        } while((b[0]%2)===(b[1]%2));
        return R.join('');
      }
      function generateJChessFEN(){
        const W = generateBackRank().toUpperCase();
        const B = generateBackRank().toLowerCase();
        return `${B}/pppppppp/8/8/8/8/PPPPPPPP/${W} w - - 0 1`;
      }

      document.getElementById('getFenBtn').addEventListener('click',()=>{
        const out = document.getElementById('fenOutput');
        out.value = game.fen();
        fenDiv.style.display = 'block';
        out.select();
      });
    });
  </script>
</body>
</html>
