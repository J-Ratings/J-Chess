<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token":"30c4e45a2b5e450c80d42a89a35e209d"}'></script>

  <meta charset="UTF-8" />
  <title>J-Chess</title>
  <meta name="description" content="J-Chess is Chess960 on steroids! Over 8 million possible positions. Play against the engine online." />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Icons / branding -->
  <link rel="icon" type="image/png" sizes="16x16" href="/Logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/Logo.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/Logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/Logo.png">
  <meta name="theme-color" content="#0d3f66">

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "J-Chess",
    "url": "https://j-chess.org/",
    "logo": "https://j-chess.org/Logo.png"
  }
  </script>

  <link rel="stylesheet" href="chessboardjs-1.0.0/css/chessboard-1.0.0.min.css" />

  <style>
    :root{
      --brand-bg:#0d3f66; --brand-fg:#fff;
      --scene-pad:14px; --side-width:300px;
      --menu-max:1080px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:#f5f5f5;color:#222;-webkit-font-smoothing:antialiased;
      font-size:17px;line-height:1.55;
    }
    html, body { overflow-x: hidden; }

    .site-bar{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--brand-bg);color:var(--brand-fg);
      padding:.7rem clamp(1rem,4vw,2.2rem);box-shadow:0 2px 4px rgba(0,0,0,.15)
    }
    .site-bar h1{margin:0;font-weight:700;font-size:1.6rem;display:flex;align-items:center;gap:10px}
    .site-bar a{color:var(--brand-fg);text-decoration:none}
    .site-bar nav a{padding:.45rem .75rem;border-radius:4px;font-weight:600}
    .site-bar nav a:hover{background:rgba(255,255,255,.18)}

    /* === Metallic button + select baseline === */
    button, select{
      font: inherit;
      font-weight: 700;
      border: 2px solid transparent;
      border-radius: 6px;
      padding: .55rem 1rem;
      cursor: pointer;
      box-shadow:
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 rgba(0,0,0,0.28),
        0 2px 4px rgba(0,0,0,0.18);
      background: linear-gradient(145deg, #e0e0e0, #bdbdbd);
      transition: all .15s ease-in-out;
    }
    button:hover, select:hover{
      background: linear-gradient(145deg, #f0f0f0, #c8c8c8);
      border-color: rgba(0,0,0,0.12);
    }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    button[aria-pressed="true"]{
      border-color:#333;
      box-shadow:
        0 0 0 3px rgba(0,0,0,0.15),
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 rgba(0,0,0,0.3);
    }

    /* === Game-type buttons (specific colours) === */
    /* Chess (silver) */
    #standardBtn{
      background: linear-gradient(145deg, #d4d4d4, #a9a9a9);
      color:#222;
    }
    #standardBtn:hover{
      background: linear-gradient(145deg, #e3e3e3, #b8b8b8);
    }
    /* Both J-Chess options (gold) */
    #symJchessBtn, #fairBtn{
      background: linear-gradient(145deg, #e0c780, #c7a93b);
      color:#222;
    }
    #symJchessBtn:hover, #fairBtn:hover{
      background: linear-gradient(145deg, #f0d890, #d1b64a);
    }

    .hidden{display:none !important}
    .muted{opacity:.9;filter:grayscale(12%)}

    .menu{
      max-width:var(--menu-max);
      margin:0 auto;
      padding:1.2rem clamp(1rem,4vw,2.2rem) 2rem;
      text-align:center;
      font-size:1.4rem;
    }
    .menu h2{margin:.4rem 0 .4rem;font-size:2.2rem}
    .menu h3{margin:.2rem 0 .8rem;font-size:1.6rem}

    .cluster{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin:.8rem 0}
    .block{max-width:820px;margin:1.1rem auto 0}

    /* Form row without labels text */
    .menu-form{
      display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;align-items:center;margin-top:.3rem
    }
    /* keep selects metallic but neutral */
    #colourSelect{ min-width: 160px; }
    #levelSelect{ min-width: 200px; }

    .menu-preview{margin-top:1.1rem;display:grid;place-items:center;min-height:340px}
    #previewWrap{position:relative;width:340px;height:340px}
    #previewBoard{width:100%;height:100%}
    #previewSpinner{
      position:absolute;top:50%;left:50%;width:60px;height:60px;border:7px solid #eee;border-top:7px solid #0077cc;border-radius:50%;
      animation:spin .8s linear infinite;transform:translate(-50%,-50%);display:none;z-index:2
    }
    #previewMask{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; background:rgba(0,0,0,.04); border-radius:4px;}
    #previewMask span{background:transparent;color:#333;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .6rem;font-size:2rem;}

    @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

    .menu-actions{display:flex;gap:.9rem;justify-content:center;margin-top:1.1rem}
    .menu-actions button{min-width:150px;font-size:1.1rem;padding:.65rem 1rem}

    .play-grid{
      height:calc(100vh - 64px);
      display:grid;
      grid-template-columns:var(--side-width) 1fr var(--side-width);
      grid-template-rows:1fr 1fr;
      grid-template-areas:
        "top centre right"
        "bottom centre right";
      gap:14px;
      padding:var(--scene-pad);
      align-items:center;
    }

    .player-slot{grid-area:top}
    .player-slot.bottom{grid-area:bottom}
    .controls{grid-area:right}
    .centre{grid-area:centre;display:grid;place-items:center;overflow:hidden;height:100%}

    #boardWrap{position:relative;width:100px;height:100px;max-width:100%;max-height:100%}
    #board{width:100%;height:100%;touch-action:none}

    .board-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.05);pointer-events:none;opacity:0;transition:opacity .2s}
    .board-overlay.show{opacity:1}
    .board-overlay .banner{background:rgba(13,63,102,.9);color:#fff;padding:.8rem 1.2rem;border-radius:6px;font-size:1.4rem;font-weight:800;letter-spacing:.2px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

    #fairStatus{margin-top:.6rem;background:#fff;border:1px solid #ddd;border-radius:4px;padding:.5rem .7rem;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:1.02em;white-space:pre-wrap;min-height:2rem}
    #loadingSpinner{position:absolute;top:50%;left:50%;width:62px;height:62px;border:7px solid #eee;border-top:7px solid #0077cc;border-radius:50%;animation:spin .8s linear infinite;transform:translate(-50%,-50%);display:none;z-index:10}

    .player-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;display:grid;grid-template-columns:112px 1fr;align-items:center;gap:14px}
    .player-avatar{width:112px;height:112px;border-radius:10px;background:#eef3f7;display:grid;place-items:center;font-size:2.4rem}
    .player-name{font-weight:800;font-size:1.3rem}
    .player-sub{color:#666;font-size:1.1rem}

    .controls{display:grid;grid-template-rows:auto auto 1fr;gap:10px}
    .card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px}
    .stack{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stack-single{display:flex;gap:8px;flex-wrap:wrap}

    @media (max-width: 900px){
      .play-grid{
        grid-template-columns:1fr;
        grid-template-rows:auto auto auto auto;
        grid-template-areas:"top" "centre" "bottom" "right";
        height:auto; min-height:calc(100vh - 64px); align-content:start; padding:8px;
      }
      .player-slot,.player-slot.bottom,.controls{width:100%;max-width:100%;margin:0 auto;}
      #boardWrap{width:calc(100vw - 16px);height:calc(100vw - 16px);max-width:100%;max-height:100%;}
    }

    .highlight-white,.highlight-black{ box-shadow: inset 0 0 0 4px #ffff00; }

    footer{margin-top:0;text-align:center;padding:1rem 0;background:#0d3f66;color:#fff;font-size:.98rem}
    footer a{color:#fff;text-decoration:underline}
  </style>
</head>
<body>
<header class="site-bar">
  <h1>
    <a href="/" style="font-size:1.9rem;">J-Chess</a>
  </h1>
  <nav>
    <a href="/" class="active">Play</a>
    <a href="/info/">Info</a>
  </nav>
</header>

<section id="menuView" class="menu">
  <h2>Over 8 million starting positions!</h2>
  <h3>Select a game type:</h3>

  <div class="cluster" role="group" aria-label="Game type">
    <button id="standardBtn" class="mode-btn" aria-pressed="false">Chess</button>
    <button id="symJchessBtn" class="mode-btn" aria-pressed="false">J-Chess</button>
    <button id="fairBtn" class="mode-btn" aria-pressed="false">J-Chess+</button>
  </div>

  <div class="block">
    <div class="menu-form">
      <!-- labels removed per request; keep aria for accessibility -->
      <select id="colourSelect" aria-label="Colour">
        <option value="random" selected>Random</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>

      <select id="levelSelect" aria-label="Difficulty"></select>
    </div>

    <div class="menu-preview">
      <div id="previewWrap">
        <div id="previewBoard"></div>
        <div id="previewSpinner"></div>
        <div id="previewMask"><span>PREVIEW</span></div>
      </div>
    </div>

    <div class="menu-actions">
      <button id="startBtn" class="btn-strong" disabled>Start</button>
      <button id="analysisBtn" class="btn-small">lichess</button>
      <button id="editorBtn" class="btn-small">Challenge Friend</button>
    </div>
  </div>
</section>

<section id="playView" class="play-grid hidden">
  <aside id="playerTop" class="player-slot"></aside>

  <main class="centre">
    <div id="boardWrap">
      <div id="board"></div>
      <div id="loadingSpinner"></div>
      <div id="boardOverlay" class="board-overlay"><div class="banner" id="overlayText"></div></div>
    </div>
    <div id="fairStatus"></div>
  </main>

  <aside id="playerBottom" class="player-slot bottom"></aside>

  <aside class="controls">
    <div class="card stack-single">
      <button id="backBtn" class="muted btn-small">Back to menu</button>
    </div>
    <div class="card stack">
      <button id="undoBtn" class="muted btn-small">Undo</button>
      <button id="flipBtn" class="muted btn-small">Flip</button>
      <button id="resetBtn" class="muted btn-small">Reset</button>
      <button id="copyPgnBtn" class="muted btn-small">Copy PGN</button>
      <button id="resignBtn" class="btn-small" style="grid-column:1/-1">Resign</button>
    </div>
  </aside>
</section>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* ===================== Config ===================== */
  const FAIR_API = 'https://polished-unit-fa43.stjukes.workers.dev'; // your Worker origin
  const POOL_CAP = 100;
  const PREVIEW_MIN_WAIT = 750;     // smoothing for preview
  const FAIR_FIND_CUTOFF_MS = 5000; // 5s polite cut-off

  const nodesByLevel = {1:5e5,2:5e5,3:5e5,4:5e5,5:5e5,6:5e5,7:5e5,8:5e5,9:5e5,10:5e5,11:5e5,12:5e5,13:5e5,14:5e5,15:1e6,16:1e6,17:1e6,18:1e6,19:1e6,20:1e6};
  const sigmaByLevel = {1:10000,2:2000,3:1000,4:500,5:320,6:240,7:210,8:175,9:155,10:130,11:95,12:70,13:50,14:40,15:30,16:20,17:15,18:10,19:5,20:0};
  const baseRatings = {1:0,2:200,3:400,4:600,5:800,6:1000,7:1200,8:1400,9:1600,10:1800,11:2000,12:2200,13:2400,14:2600,15:2800,16:3000,17:3200,18:3400,19:3600,20:3800};

  /* ===================== State ===================== */
  let mode = null;
  let currentLevel = 8;
  let chosenColour = 'random';
  let isHumanBlack = false;
  let startFen = '8/8/8/8/8/8/8/8 w - - 0 1';
  let waitingForEngineFirst = false;
  let manualFlip = false;
  let resigned = false;
  let previewFen = null;
  let backfilledOnce = false;

  /* ============ Difficulty dropdown: build ============ */
  const levelSelect = document.getElementById('levelSelect');

  function computeLevelColour(level){
    const palette = [
      '#12ff23', '#60f400', '#8be600', '#a2d900', '#b0ce00',
      '#bac300', '#c1b800', '#c6ae00', '#dfa000', '#cb9a00',
      '#cc9000', '#cd8700', '#ce7d00', '#ce7200', '#cf6700',
      '#d05b00', '#d14c00', '#d43800', '#d51b00', '#ce0909'
    ];
    return palette[level - 1] || '#ffffff';
  }

  levelSelect.innerHTML = '';
  for (let i = 1; i <= 20; i++){
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `Lv. ${i} (${baseRatings[i]})`;
    if (i === 8) opt.selected = true;
    levelSelect.appendChild(opt);
  }

  function paintLevelOptions(){
    for (let i = 0; i < levelSelect.options.length; i++){
      const lvl = i + 1;
      const opt = levelSelect.options[i];
      const colour = computeLevelColour(lvl);
      opt.style.backgroundColor = colour;
      opt.style.fontWeight = '700';
      opt.style.textAlign = 'left';
      opt.style.color = 'black';
    }
  }
  function updateLevelSelectBackground(){
    const sel = levelSelect.options[levelSelect.selectedIndex];
    const lvl = +sel.value;
    const bg = computeLevelColour(lvl);
    levelSelect.style.backgroundColor = bg;
    levelSelect.style.fontWeight = '700';
    levelSelect.style.textAlign = 'left';
    levelSelect.style.color = 'black';
  }
  paintLevelOptions();
  updateLevelSelectBackground();

  levelSelect.addEventListener('change', function(){
    currentLevel = +this.value;
    updateLevelSelectBackground();
    setOpponentMeta();
  });

  /* ---------- Player colour dropdown paint ---------- */
  const colourSelect = document.getElementById('colourSelect');
  (function paintColourOptions(){
    for (let i = 0; i < colourSelect.options.length; i++){
      const opt = colourSelect.options[i];
      const v = opt.value.toLowerCase();
      if (v === 'random'){ opt.style.backgroundColor = '#cfcfcf'; opt.style.color = 'black'; }
      else if (v === 'white'){ opt.style.backgroundColor = '#ffffff'; opt.style.color = 'black'; }
      else if (v === 'black'){ opt.style.backgroundColor = '#3a3a3a'; opt.style.color = 'white'; }
      opt.style.fontWeight = '700';
      opt.style.textAlign = 'left';
    }
  })();

  function updateColourSelectBackground(){
    const sel = colourSelect.options[colourSelect.selectedIndex];
    colourSelect.style.backgroundColor = sel.style.backgroundColor;
    colourSelect.style.color = sel.style.color;
    colourSelect.style.fontWeight = '700';
    colourSelect.style.textAlign = 'left';
  }
  updateColourSelectBackground();

  /* ===================== Elements ===================== */
  const menuView = document.getElementById('menuView');
  const playView = document.getElementById('playView');
  const statusDiv = document.getElementById('fairStatus');
  const spinner = document.getElementById('loadingSpinner');
  const overlay = document.getElementById('boardOverlay');
  const overlayText = document.getElementById('overlayText');
  const previewSpinner = document.getElementById('previewSpinner');
  const startBtn = document.getElementById('startBtn');

  // Player cards
  const aiCard = document.createElement('div');
  aiCard.className = 'player-card';
  aiCard.innerHTML = `
    <div class="player-avatar">🤖</div>
    <div>
      <div class="player-name">AI</div>
      <div class="player-sub">
        <span id="oppBadge" class="level-badge">Lv. 8 (1400)</span>
      </div>
    </div>
  `;
  const youCard = document.createElement('div');
  youCard.className = 'player-card';
  youCard.innerHTML = `<div class="player-avatar">👤</div><div><div class="player-name">You</div></div>`;

  function setOpponentMeta(){
    const base = baseRatings[currentLevel];
    const badge = document.getElementById('oppBadge');
    if (badge){
      badge.textContent = `Lv. ${currentLevel} (${base})`;
      badge.style.backgroundColor = computeLevelColour(currentLevel);
      badge.style.color = (currentLevel >= 16) ? 'white' : 'black';
    }
  }
  setOpponentMeta();

  function showMenu(){ menuView.classList.remove('hidden'); playView.classList.add('hidden'); }
  function showPlay(){
    menuView.classList.add('hidden'); playView.classList.remove('hidden');
    resizeBoard();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function clearStatus(){ statusDiv.textContent=''; }

  function renderCards(){
    const top=document.getElementById('playerTop');
    const bottom=document.getElementById('playerBottom');
    top.innerHTML=''; bottom.innerHTML='';
    if (manualFlip){ top.appendChild(youCard); bottom.appendChild(aiCard); }
    else { top.appendChild(aiCard); bottom.appendChild(youCard); }
  }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
  function generateBackRank(){
    const P=['r','n','b','q','k','b','n','r']; let R, bs;
    do { R=shuffle(P.slice()); bs=[R.indexOf('b'), R.lastIndexOf('b')]; } while((bs[0]%2)===(bs[1]%2));
    return R.join('');
  }
  function generateJChessFEN(){
    const W=generateBackRank().toUpperCase(); const B=generateBackRank().toLowerCase();
    return `${B}/pppppppp/8/8/8/8/PPPPPPPP/${W} w - - 0 1`;
  }
  function generateSymmetricJChessFEN(){
    const W=generateBackRank().toUpperCase(); const B=W.toLowerCase();
    return `${B}/pppppppp/8/8/8/8/PPPPPPPP/${W} w - - 0 1`;
  }

  function formatOrdinal(n){
    const formatted=n.toLocaleString('en-GB');
    const v=n%100;
    const suff=(v>=11&&v<=13)?'th':(n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th');
    return `${formatted}${suff}`;
  }
  function showCountOverlay(fen){
    fetch(`https://round-frost-df74.stjukes.workers.dev/?fen=${encodeURIComponent(fen)}`)
      .then(r=>r.json()).then(d=>{
        const c=Number(d.count||0);
        overlayText.textContent=`You are the ${formatOrdinal(c)} to play this position`;
        overlay.classList.add('show'); setTimeout(()=>overlay.classList.remove('show'),2000);
      }).catch(()=>{});
  }

  /* ===================== Boards ===================== */
  const game = new Chess();

  function onDragStart(source, piece) {
    if (resigned || game.game_over()) return false;
    const t = game.turn();
    if (!isHumanBlack) return piece[0] === 'w' && t === 'w';
    return !waitingForEngineFirst && piece[0] === 'b' && t === 'b';
  }

  function onDrop(source, target) {
    const mv = game.move({ from: source, to: target, promotion: 'q' });
    if (!mv) return 'snapback';
    requestAnimationFrame(() => board.position(game.fen(), false));
    checkGameEnd();
    if (!game.game_over()) handleEngineMove(source, target);
  }

  function onSnapEnd() { board.position(game.fen(), false); }

  const board = Chessboard('board', {
    draggable: true,
    position: startFen,
    pieceTheme: 'chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png',
    onDragStart,
    onDrop,
    onSnapEnd
  });

  const previewBoard = Chessboard('previewBoard', {
    draggable: false,
    position: '8/8/8/8/8/8/8/8 w - - 0 1',
    showNotation: false,
    pieceTheme: 'chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png'
  });

  $(window).on('resize', resizeBoard);
  function resizeBoard(){
    const scene = document.querySelector('.centre');
    const wrap  = document.getElementById('boardWrap');
    if (!scene || !wrap) return;

    const styles = getComputedStyle(scene);
    const w = scene.clientWidth  - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight);
    const h = scene.clientHeight - parseFloat(styles.paddingTop)  - parseFloat(styles.paddingBottom);

    const isMobile = window.matchMedia('(max-width: 900px)').matches;
    const size = Math.floor(isMobile ? w : Math.min(w, h));

    wrap.style.width  = size + 'px';
    wrap.style.height = size + 'px';
    board.resize();
  }

  function setOrientation(){
    board.orientation(
      manualFlip ? (isHumanBlack ? 'white' : 'black')
                 : (isHumanBlack ? 'black' : 'white')
    );
  }

  const $board = $('#board');
  function clearHighlights(){
    $board.find('.square-55d63').removeClass('highlight-white highlight-black');
  }
  function highlightMove(from, to, col){
    clearHighlights();
    $board.find(`.square-${from}`).addClass(`highlight-${col}`);
    $board.find(`.square-${to}`).addClass(`highlight-${col}`);
  }

  /* ===================== Engines ===================== */
  const engine=new Worker('engine/stockfish-17-lite-single.js');
  engine.postMessage('uci');
  engine.addEventListener('message',function init({data}){
    if((data||'').trim()==='uciok'){ engine.postMessage('setoption name MultiPV value 50'); engine.postMessage('ucinewgame'); engine.postMessage('isready'); }
    if((data||'').trim()==='readyok') engine.removeEventListener('message',init);
  });

  const evalEngine=new Worker('engine/stockfish-17-lite-single.js');
  evalEngine.postMessage('uci');
  evalEngine.addEventListener('message',function initE({data}){
    if((data||'').trim()==='uciok'){ evalEngine.postMessage('ucinewgame'); evalEngine.postMessage('setoption name UCI_LimitStrength value false'); evalEngine.postMessage('isready'); }
    if((data||'').trim()==='readyok') evalEngine.removeEventListener('message',initE);
  });

  function randomGaussian(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

  function thresholdSelect(cands, sigma) {
    const best = cands[0].cp;
    const g = Math.abs(randomGaussian());
    const tempered = g / Math.pow(1 + Math.abs(g) / 2, 0.6);
    const actualSigma = sigma * tempered;
    const allowed = cands.filter(c => (best - c.cp) <= actualSigma);
    const pick = allowed.length ? allowed[Math.floor(Math.random() * allowed.length)] : cands[0];
    return { pick, actualSigma };
  }

  function adjustSigma(base){
    if (mode === 'standard') {
      const moves = Math.floor(game.history().length / 2) + 1;
      if (currentLevel >= 3 && currentLevel <= 6) {
        if (moves <= 3) return base / 3;
        if (moves === 4) return base / 2;
        if (moves === 5) return base / 2;
        return base;
      }
      if (currentLevel >= 7 && currentLevel <= 19) {
        if (moves <= 6) return base / 4;
        if (moves === 7) return base / 3;
        if (moves === 8) return base / 2;
        return base;
      }
    }
    return base;
  }

  function handleEngineMove(src,tgt){
    if(resigned) return;
    highlightMove(src,tgt,'white');
    const nodes=nodesByLevel[currentLevel];
    const sigma=adjustSigma(sigmaByLevel[currentLevel]);
    const cand={}; let seen=false;
    const startTime=performance.now();
    function onInfo({data}){
      const line=(data||'').trim();
      if(line.startsWith('info') && line.includes('multipv')){
        const mpv=+line.match(/multipv\s+(\d+)/)[1];
        const pv=line.match(/pv\s+([a-h][1-8][a-h][1-8][qrbn]?)/)[1];
        const cpm=line.match(/score cp\s+(-?\d+)/);
        const mat=line.match(/score mate\s+(-?\d+)/);
        if(mpv && pv && (cpm||mat)){
          const cp=cpm ? +cpm[1] : (mat[1]>0 ? 100000-+mat[1]*100 : -100000-+mat[1]*100);
          cand[mpv]={move:pv,cp}; seen=true;
        }
      }
      if(line.startsWith('bestmove')){
        engine.removeEventListener('message',onInfo);
        if(!seen) return;
        const elapsed=performance.now()-startTime;
        const delay=Math.max(0,750-elapsed);
        setTimeout(()=>{
          if(resigned) return;
          const { pick } = thresholdSelect(Object.values(cand), sigma);
          const f=pick.move.slice(0,2), t=pick.move.slice(2,4);
          highlightMove(f,t,'black');
          const emv=game.move({from:f,to:t,promotion:'q'});
          board.position(game.fen(),false);
          if (typeof playForMove === 'function') playForMove(emv);
          checkGameEnd();
        },delay);
      }
    }
    engine.addEventListener('message',onInfo);
    engine.postMessage('position fen '+game.fen());
    engine.postMessage('go nodes '+nodes);
  }

  function checkGameEnd(){
    if(!game.game_over()) return;
    let text='';
    if(game.in_checkmate()){
      text=(game.turn()==='w')?'Checkmate: Black wins':'Checkmate: White wins';
    }else if(game.in_stalemate()){
      text='Stalemate: Draw';
    }else if(game.insufficient_material()){
      text='Insufficient Material: Draw';
    }else if(game.in_threefold_repetition()){
      text='Threefold Repetition: Draw';
    }else if(game.in_draw()){
      text='50-move Rule / Draw';
    }else{
      text='Game over';
    }
    overlayText.textContent=text;
    overlay.classList.add('show');
    setTimeout(()=>overlay.classList.remove('show'),2000);
  }

  /* ===================== Fair FEN helpers with 5s cut-off ===================== */
  function evalFairnessOnce(fen, ms=1000){
    return new Promise(resolve=>{
      let lastCp=null;
      function onEval({data}){
        const line = (data||'').trim();
        if(line.startsWith('info') && line.includes('score cp')){
          const m=line.match(/score cp\s+(-?\d+)/);
          if(m) lastCp=+m[1];
        }
        if(line.startsWith('info') && line.includes('score mate')){
          const m=line.match(/score mate\s+(-?\d+)/);
          if(m){ const mv=+m[1]; lastCp = mv>0 ? 5000 : -5000; }
        }
        if(line.startsWith('bestmove')){
          evalEngine.removeEventListener('message',onEval);
          resolve(Math.abs(lastCp||0) <= 40);
        }
      }
      evalEngine.addEventListener('message',onEval);
      evalEngine.postMessage('position fen '+fen);
      evalEngine.postMessage('go movetime '+ms);
    });
  }

  function genRandomJChessFEN(){
    const W=generateBackRank().toUpperCase(); const B=generateBackRank().toLowerCase();
    return `${B}/pppppppp/8/8/8/8/PPPPPPPP/${W} w - - 0 1`;
  }

  async function findLocalFairFENWithCutoff(maxMs=FAIR_FIND_CUTOFF_MS){
    const start = performance.now();
    while (performance.now() - start < maxMs){
      const fen = genRandomJChessFEN();
      const fair = await evalFairnessOnce(fen, 1000);
      if (fair) return fen;
    }
    return null; // exceeded cut-off
  }

  /* ===================== Server pool interactions ===================== */
  async function fetchWithTimeout(url, opts={}, timeoutMs=4500){
    const ctrl = new AbortController();
    const id = setTimeout(()=>ctrl.abort(), timeoutMs);
    try{
      const res = await fetch(url, {...opts, signal: ctrl.signal });
      clearTimeout(id);
      return res;
    }catch(e){
      clearTimeout(id);
      throw e;
    }
  }

  async function getPoolStats(){
    try{
      const r = await fetchWithTimeout(FAIR_API + '/stats', { cache:'no-store' }, 3000);
      if(!r.ok) return null;
      return await r.json();
    }catch{ return null; }
  }

  async function tryFetchFairFromServer(){
    try{
      const r = await fetchWithTimeout(FAIR_API + '/fairfen', { cache:'no-store' }, 4500);
      if (r.status === 204) return null;
      if (!r.ok) return null;
      const j = await r.json();
      return j && j.fen ? j : null;
    }catch{ return null; }
  }

  async function submitToServer(fen){
    try{
      await fetchWithTimeout(FAIR_API + '/submit', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ fen })
      }, 3000);
    }catch{}
  }

  /* ===================== Start modes (preview-driven) ===================== */
  function afterStartWithFEN(fen){
    startFen=fen; resigned=false;
    game.load(fen); board.position(fen,false);
    clearHighlights(); setOrientation();
    spinner.style.display='none'; overlay.classList.remove('show');
    showCountOverlay(fen);
    setOpponentMeta();
    if(isHumanBlack){ waitingForEngineFirst=true; engineReplyFromCurrent(); } else { waitingForEngineFirst=false; }
  }

  function engineReplyFromCurrent(){
    const nodes=nodesByLevel[currentLevel];
    const sigma=adjustSigma(sigmaByLevel[currentLevel]);
    const cand={}; let seen=false;
    const startTime=performance.now();
    function listener({data}){
      const line=(data||'').trim();
      if(line.startsWith('info') && line.includes('multipv')){
        const mpv=+line.match(/multipv\s+(\d+)/)[1];
        const pv=line.match(/pv\s+([a-h][1-8][a-h][1-8][qrbn]?)/)[1];
        const cpm=line.match(/score cp\s+(-?\d+)/);
        const mat=line.match(/score mate\s+(-?\d+)/);
        if(mpv && pv && (cpm||mat)){
          const cp=cpm?+cpm[1]:(mat[1]>0?100000-+mat[1]*100:-100000-+mat[1]*100);
          cand[mpv]={move:pv,cp}; seen=true;
        }
      }
      if(line.startsWith('bestmove')){
        engine.removeEventListener('message',listener);
        if(!seen) return;
        const elapsed=performance.now()-startTime;
        const delay=Math.max(0,500-elapsed);
        setTimeout(()=>{
          if(resigned) return;
          const { pick } = thresholdSelect(Object.values(cand), sigma);
          const f=pick.move.slice(0,2), t=pick.move.slice(2,4);
          const col=game.turn()==='w'?'black':'white';
          highlightMove(f,t,col);
          const emv=game.move({from:f,to:t,promotion:'q'});
          board.position(game.fen(),false);
          waitingForEngineFirst=false;
          if (typeof playForMove === 'function') playForMove(emv);
          checkGameEnd();
        },delay);
      }
    }
    engine.addEventListener('message',listener);
    engine.postMessage('position fen '+game.fen());
    engine.postMessage('go nodes '+nodes);
  }

  /* ===================== MENU ===================== */
  const typeButtons = [
    ['standard', '#standardBtn'],
    ['sym',      '#symJchessBtn'],
    ['fair',     '#fairBtn']
  ];
  typeButtons.forEach(([m,sel])=>{
    document.querySelector(sel).addEventListener('click',()=>{
      mode=m;
      typeButtons.forEach(([,s])=>document.querySelector(s).setAttribute('aria-pressed','false'));
      document.querySelector(sel).setAttribute('aria-pressed','true');

      startBtn.disabled = (mode === 'fair'); // enable when preview ready

      previewBoard.position('8/8/8/8/8/8/8/8 w - - 0 1',false);
      previewSpinner.style.display='block';
      previewFen=null;

      queuePreview();
    });
  });

  colourSelect.addEventListener('change',function(){
    chosenColour=this.value;
    updateColourSelectBackground();
  });

  // Build preview: server-first for fair; 5s cut-off; Start uses this FEN
  let previewTimer = null;
  async function queuePreview(){
    if(!mode) return;
    if(previewTimer) clearTimeout(previewTimer);
    const t0 = performance.now();

    const finishPreview = (fen) => {
      const elapsed = performance.now() - t0;
      const waitMore = Math.max(0, PREVIEW_MIN_WAIT - elapsed);
      setTimeout(()=>{
        previewBoard.position(fen,false);
        previewSpinner.style.display='none';
        previewFen = fen;
        startBtn.disabled = false;
      }, waitMore);
    };

    if(mode==='standard'){
      finishPreview('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
      return;
    }
    if(mode==='sym'){
      finishPreview(generateSymmetricJChessFEN());
      return;
    }

    // J-Chess+ (fair): try server, then local (5s cap), else vanilla J-Chess
    if(mode==='fair'){
      let served = null;
      try { served = await tryFetchFairFromServer(); } catch {}
      if (served && served.fen){
        finishPreview(served.fen);
        return;
      }
      const localFen = await findLocalFairFENWithCutoff();
      if (localFen){
        finishPreview(localFen);
        submitToServer(localFen);
        return;
      }
      finishPreview(generateJChessFEN());
    }
  }

  // Start always uses preview FEN
  startBtn.addEventListener('click', async ()=>{
    if(!mode) return;

    isHumanBlack = (chosenColour==='black') ? true : (chosenColour==='white' ? false : Math.random()<0.5);
    manualFlip=false;
    renderCards();
    showPlay();
    clearStatus(); overlay.classList.remove('show');

    let fenToUse = previewFen;
    if (!fenToUse){
      if (mode === 'standard') fenToUse = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      else if (mode === 'sym') fenToUse = generateSymmetricJChessFEN();
      else if (mode === 'fair') fenToUse = generateJChessFEN();
    }
    afterStartWithFEN(fenToUse);
  });

  document.getElementById('backBtn').addEventListener('click',()=>{ showMenu(); });

  document.getElementById('analysisBtn').addEventListener('click',()=>{
    const fen=previewFen || startFen; const pathFen=(fen||'').split(' ').join('_');
    window.open(`https://lichess.org/analysis/standard/${encodeURIComponent(pathFen)}`,'_blank');
  });
  document.getElementById('editorBtn').addEventListener('click',()=>{
    const fen=previewFen || startFen; const encodedFen=encodeURIComponent(fen||'');
    window.open(`https://lichess.org/?fen=${encodedFen}#friend`,'_blank');
  });

  document.getElementById('resetBtn').addEventListener('click',()=>{
    resigned=false;
    game.load(startFen); board.position(startFen,false);
    clearHighlights(); setOrientation();
    renderCards();
    if(isHumanBlack){ waitingForEngineFirst=true; engineReplyFromCurrent(); } else { waitingForEngineFirst=false; }
    overlay.classList.remove('show');
  });
  document.getElementById('copyPgnBtn').addEventListener('click',()=>{
    const pgn=game.pgn()||''; navigator.clipboard.writeText(pgn).then(()=>{
      overlayText.textContent='PGN copied';
      overlay.classList.add('show'); setTimeout(()=>overlay.classList.remove('show'),900);
    });
  });
  document.getElementById('undoBtn').addEventListener('click',()=>{
    if(resigned) return;
    const turn=game.turn(); const first=game.undo();
    if(turn === (isHumanBlack ? 'b' : 'w')) game.undo();
    if(first){ board.position(game.fen(),false); clearHighlights(); waitingForEngineFirst=false; }
    overlay.classList.remove('show');
  });
  document.getElementById('flipBtn').addEventListener('click',()=>{
    manualFlip=!manualFlip; setOrientation(); renderCards();
  });
  document.getElementById('resignBtn').addEventListener('click',()=>{
    resigned=true;
    overlayText.textContent='You resigned';
    overlay.classList.add('show');
    setTimeout(()=>overlay.classList.remove('show'),2000);
  });

  /* ===================== Background seeding (once per load, 5s cap) ===================== */
  (async function silentBackfill(){
    if (backfilledOnce) return;
    backfilledOnce = true;

    const stats = await getPoolStats().catch(()=>null);
    if (stats && typeof stats.ready === 'number' && stats.ready >= POOL_CAP) return;

    try{
      const fen = await findLocalFairFENWithCutoff();
      if (fen) submitToServer(fen);
    }catch{}
  })();

  /* ===================== Init ===================== */
  const previewBoardStart='8/8/8/8/8/8/8/8 w - - 0 1';
  const gameObj = new Chess();
  gameObj.load(startFen);
  game.load(startFen); board.position(startFen,false); setOrientation(); clearStatus();
  renderCards();
  previewBoard.position(previewBoardStart,false);
  previewSpinner.style.display='none';
});
</script>
