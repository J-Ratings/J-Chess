<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>J–Chess + Stockfish (MultiPV + variable nodes + half-threshold)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="chessboardjs-1.0.0/css/chessboard-1.0.0.min.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }
    #controls {
      margin: 15px 0;
    }
    #controls > * {
      margin: 0 8px;
      padding: 8px 16px;
      font-size: 1em;
      cursor: pointer;
    }
    #board-container,
    #board {
      touch-action: none;
    }
    #board-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      aspect-ratio: 1;
    }
    #board { width: 100%; height: 100%; }
    #loadingSpinner {
      position: absolute;
      top: 50%; left: 50%;
      width: 50px; height: 50px;
      border: 6px solid #eee;
      border-top: 6px solid #0077cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
      pointer-events: none;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    #fenContainer {
      margin: 12px auto; max-width: 400px; display: none;
    }
    #fenOutput {
      width: 100%; padding: 8px; font-family: monospace;
    }
    #fairStatus {
      margin: 12px auto; max-width: 400px;
      text-align: left; font-family: monospace; white-space: pre-wrap;
    }
    #stats {
      margin-top: 12px; text-align: center;
    }
    #stats h2 {
      margin: 6px 0; font-size: 1.2em; font-weight: 600;
    }
    .highlight-white {
      box-shadow: inset 0 0 3px 3px yellow !important;
    }
    .highlight-black {
      box-shadow: inset 0 0 3px 3px blue !important;
    }
  </style>
</head>
<body>
  <h1>J–Chess</h1>

  <div id="controls">
    <button id="randomiseBtn">Generate Position</button>
    <button id="fairBtn">Generate Fair Position</button>
    <label for="timeSelect">Generation Time:</label>
    <select id="timeSelect">
      <option value="250">0.25 s</option>
      <option value="500">0.5 s</option>
      <option value="1000" selected>1 s</option>
      <option value="2000">2 s</option>
      <option value="5000">5 s</option>
    </select>
    <label for="levelSelect">Level:</label>
    <select id="levelSelect">
      <option value="1">Lv. 1 (500)</option>
      <option value="2">Lv. 2 (800)</option>
      <option value="3">Lv. 3 (1200)</option>
      <option value="4">Lv. 4 (1500)</option>
      <option value="5" selected>Lv. 5 (1800)</option>
      <option value="6">Lv. 6 (2000)</option>
      <option value="7">Lv. 7 (2200)</option>
      <option value="8">Lv. 8 (2500)</option>
      <option value="9">Lv. 9 (2800)</option>
      <option value="10">Lv. 10 (3500)</option>
    </select>
    <button id="getFenBtn">Get FEN</button>
    <button id="newGameBtn">New Game</button>
  </div>

  <div id="board-container">
    <div id="board"></div>
    <div id="loadingSpinner"></div>
  </div>

  <div id="fenContainer">
    <textarea id="fenOutput" readonly rows="2"></textarea>
  </div>

  <div id="fairStatus"></div>

  <div id="stats">
    <h2>8.3 million starting positions</h2>
    <h2>2.5 million fair starting positions</h2>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const nodesByLevel = {
      1: 500000, 2: 500000, 3: 500000, 4: 500000,
      5: 500000, 6: 500000,
      7: 1000000, 8: 1000000,
      9: 2000000, 10: 3000000
    };
    const thresholdByLevel = {
      1:1000, 2:500, 3:300, 4:200,
      5:75, 6:60, 7:45, 8:30, 9:15, 10:0
    };

    let currentLevel = 5;
    let searchingFair = false;
    let startFen;

    const fenDiv    = document.getElementById('fenContainer');
    const statusDiv = document.getElementById('fairStatus');
    const $board    = $('#board');

    function clearHighlights() {
      $board.find('.square-55d63')
            .removeClass('highlight-white highlight-black');
    }
    function highlightMove(f, t, col) {
      clearHighlights();
      $board.find(`.square-${f}`).addClass(`highlight-${col}`);
      $board.find(`.square-${t}`).addClass(`highlight-${col}`);
    }

    // Create play-engine (MultiPV=10)
    const engine = new Worker('engine/stockfish-17-lite-single.js');
    engine.postMessage('uci');
    engine.addEventListener('message', function setupPlay({data}) {
      if (data.trim() === 'uciok') {
        engine.postMessage('setoption name MultiPV value 10');
        engine.postMessage('ucinewgame');
        engine.postMessage('isready');
      }
      if (data.trim() === 'readyok') {
        engine.removeEventListener('message', setupPlay);
      }
    });

    // Create eval-engine
    const evalEngine = new Worker('engine/stockfish-17-lite-single.js');
    evalEngine.postMessage('uci');
    evalEngine.addEventListener('message', function setupEval({data}) {
      if (data.trim() === 'uciok') {
        evalEngine.postMessage('ucinewgame');
        evalEngine.postMessage('setoption name UCI_LimitStrength value false');
        evalEngine.postMessage('isready');
      }
      if (data.trim() === 'readyok') {
        evalEngine.removeEventListener('message', setupEval);
      }
    });

    $('#levelSelect').on('change', function() {
      currentLevel = +this.value;
    });

    const game  = new Chess();
    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: 'chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png',
      onDragStart, onDrop, onSnapEnd
    });
    $(window).resize(board.resize);

    // capture the current start‐position
    startFen = game.fen();

    function onDragStart(src, piece) {
      return !(game.game_over() || piece[0] !== 'w');
    }
    function onSnapEnd() {
      board.position(game.fen(), false);
    }

    function onDrop(src, tgt) {
      const mv = game.move({ from: src, to: tgt, promotion: 'q' });
      if (!mv) return 'snapback';

      handleEngineMove(src, tgt);
    }

    function handleEngineMove(src, tgt) {
      highlightMove(src, tgt, 'white');
      fenDiv.style.display  = 'none';
      statusDiv.textContent = '';

      const baseThreshold = thresholdByLevel[currentLevel] || 0;
      let threshold = baseThreshold;
      const fullMoves = Math.floor(game.history().length / 6);
      if (currentLevel >= 4 && fullMoves < 5) {
        threshold = baseThreshold / 2;
      }

      const nodes    = nodesByLevel[currentLevel] || 500000;
      let candidates = [];

      function handleEngine({data}) {
        const line = data.trim();
        if (line.startsWith('info') && line.includes('multipv') && line.includes('score cp')) {
          const mpv = +line.match(/multipv\s+(\d+)/)[1];
          const cp  = +line.match(/score cp\s+(-?\d+)/)[1];
          const uci = line.match(/pv\s+([a-h][1-8][a-h][1-8][qrbn]?)/)[1];
          candidates[mpv - 1] = { move: uci, score: cp };
        }
        if (line.startsWith('bestmove')) {
          engine.removeEventListener('message', handleEngine);
          if (!candidates.length) return;
          const bestScore = candidates[0].score;
          const pool = candidates.filter(c => c && c.score >= bestScore - threshold);
          const choice = pool[Math.floor(Math.random() * pool.length)].move;
          const f = choice.slice(0, 2), t = choice.slice(2, 4);
          highlightMove(f, t, 'black');
          game.move({ from: f, to: t, promotion: 'q' });
          board.position(game.fen(), false);
        }
      }

      engine.addEventListener('message', handleEngine);
      engine.postMessage('position fen ' + game.fen());
      engine.postMessage('go nodes ' + nodes);
    }

    $('#randomiseBtn').click(() => {
      fenDiv.style.display  = 'none';
      statusDiv.textContent = '';
      const fen = generateJChessFEN();
      game.load(fen);
      board.position(fen, false);
      clearHighlights();
      startFen = fen;
    });

    $('#fairBtn').click(() => {
      if (searchingFair) return;
      fenDiv.style.display  = 'none';
      statusDiv.textContent = '';
      searchingFair = true;
      $('#loadingSpinner').show();
      tryNextFair();
    });

    function tryNextFair() {
      const fen = generateJChessFEN();
      statusDiv.textContent += fen + '\n';
      let lastCp = null;
      const ms   = +$('#timeSelect').val();

      evalEngine.postMessage('position fen ' + fen);
      evalEngine.postMessage('go movetime ' + ms);

      function onEval({data}) {
        const line = data.trim();
        if (line.startsWith('info') && line.includes('score cp')) {
          lastCp = +line.match(/score cp\s+(-?\d+)/)[1];
        }
        if (line.startsWith('bestmove')) {
          evalEngine.removeEventListener('message', onEval);
          const score = ((lastCp || 0) / 100).toFixed(2);
          const fair  = Math.abs((lastCp || 0) / 100) <= 0.4;
          statusDiv.textContent += `${score} => ${fair ? 'Fair' : 'Unfair'}\n\n`;
          if (fair) {
            game.load(fen);
            board.position(fen, false);
            clearHighlights();
            startFen = fen;
            searchingFair = false;
            $('#loadingSpinner').hide();
          } else {
            setTimeout(tryNextFair, 30);
          }
        }
      }
      evalEngine.addEventListener('message', onEval);
    }

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function generateBackRank() {
      const P = ['r','n','b','q','k','b','n','r'];
      let R, b;
      do {
        R = shuffle(P.slice());
        b = [R.indexOf('b'), R.lastIndexOf('b')];
      } while ((b[0] % 2) === (b[1] % 2));
      return R.join('');
    }
    function generateJChessFEN() {
      const W = generateBackRank().toUpperCase();
      const B = generateBackRank().toLowerCase();
      return `${B}/pppppppp/8/8/8/8/PPPPPPPP/${W} w - - 0 1`;
    }

    document.getElementById('newGameBtn').addEventListener('click', () => {
      fenDiv.style.display  = 'none';
      statusDiv.textContent = '';
      game.load(startFen);
      board.position(startFen, false);
      clearHighlights();
    });

    document.getElementById('getFenBtn').addEventListener('click', () => {
      const out = document.getElementById('fenOutput');
      out.value = game.fen();
      fenDiv.style.display = 'block';
      out.select();
    });

  });
  </script>
</body>
</html>
